<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBUM | TRAININGONE - IT SOLUTIONS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230054A6%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Orbitron, sans-serif%22 font-weight=%22bold%22 font-size=%2260%22>T1</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;700&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
         :root {
            --lime: #39B54A;
            --orange: #F7941D;
            --navy: #0054A6;
        }
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f4f4f4;
            background-image: linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #1a1a1a;
        }
        /* Mobile Menu */
        
        #mobile-menu {
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            pointer-events: none;
            /* ป้องกันการคลิกตอนเมนูปิด */
        }
        
        #mobile-menu.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        /* Modal Settings */
        
        #albumModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }
        
        .modal-content {
            position: relative;
            background: white;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            overflow-y: auto;
            transform: translateY(30px);
            opacity: 0;
            transition: all 0.4s ease;
        }
        
        @media (min-width: 768px) {
            .modal-content {
                height: 90vh;
                border-radius: 2rem;
            }
        }
        
        .modal-open .modal-content {
            transform: translateY(0);
            opacity: 1;
        }
        /* Hamburger Animation */
        
        .active .line-1 {
            transform: translateY(8px) rotate(45deg);
        }
        
        .active .line-2 {
            opacity: 0;
        }
        
        .active .line-3 {
            transform: translateY(-8px) rotate(-45deg);
        }
        
        .menu-btn-line {
            transition: all 0.3s ease;
            transform-origin: center;
        }
        
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(to right, var(--navy), var(--lime));
            z-index: 10000;
            width: 0%;
        }
    </style>
</head>

<body class="overflow-x-hidden">
    <div id="scroll-progress"></div>

    <header class="fixed w-full z-[500] bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="relative z-[600]">
                <div class="flex flex-col items-start leading-none">
                    <span class="text-[9px] uppercase tracking-tighter text-gray-400 mb-1">All Training in One Solution</span>
                    <div class="flex items-center gap-1 font-bold text-xl md:text-2xl">
                        <span style="color: var(--orange)">TRAINING</span>
                        <span class="bg-[#39B54A] text-white px-2 py-0.5 rounded ml-1">ONE</span>
                    </div>
                </div>
            </a>

            <nav class="hidden md:flex space-x-8 text-sm font-bold uppercase">
                <a href="index.html" class="hover:text-[#39B54A] transition text-gray-600">หน้าแรก</a>
                <a href="album.html" class="text-[#39B54A] border-b-2 border-[#39B54A]">อัลบั้ม</a>
            </nav>

            <button id="mobile-menu-btn" class="md:hidden flex flex-col justify-center items-center w-10 h-10 relative z-[600]" onclick="toggleMobileMenu()">
                <span class="menu-btn-line line-1 w-6 h-0.5 bg-gray-800 mb-1.5"></span>
                <span class="menu-btn-line line-2 w-6 h-0.5 bg-gray-800 mb-1.5"></span>
                <span class="menu-btn-line line-3 w-6 h-0.5 bg-gray-800"></span>
            </button>
        </div>

        <div id="mobile-menu" class="fixed top-0 left-0 w-full h-screen flex flex-col items-center justify-center md:hidden">
            <nav class="flex flex-col items-center space-y-8">
                <a href="index.html" class="text-3xl font-bold text-gray-800" onclick="toggleMobileMenu()">Home</a>
                <a href="album.html" class="text-3xl font-bold text-[#39B54A]" onclick="toggleMobileMenu()">Album</a>
                <a href="index.html#contact" class="text-3xl font-bold text-[#0054A6]" onclick="toggleMobileMenu()">Contact</a>
            </nav>
        </div>
    </header>

    <section class="pt-40 pb-12">
        <div class="container mx-auto px-6 text-center">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">Activity <span style="color: var(--lime)">Album</span></h1>
            <p class="text-gray-500 max-w-2xl mx-auto italic">ประมวลภาพกิจกรรม การติดตั้งอุปกรณ์ และบรรยากาศงานสัมมนาที่เราดูแล</p>
            <div class="w-24 h-1 bg-lime-500 mx-auto mt-8"></div>
        </div>
    </section>

    <section class="pb-24">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="bg-white p-4 rounded-[2rem] shadow-xl cursor-pointer transition hover:-translate-y-2 group" onclick="openAlbum('elaas')">
                    <div class="overflow-hidden rounded-2xl mb-4 h-64">
                        <img src="LINE_ALBUM_New e-LAAS อบจ.สระแก้ว 73(73)_260322_1.jpg" class="w-full h-full object-cover transition duration-500 group-hover:scale-110" alt="e-LAAS">
                    </div>
                    <div class="px-2 pb-2">
                        <h3 class="font-bold text-xl">New e-LAAS อบจ.สระแก้ว</h3>
                        <p class="text-gray-400 text-sm mt-1">อบรมระบบบัญชีคอมพิวเตอร์ลูกท้องถิ่น</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="albumModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="sticky top-0 z-[100] bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center shadow-sm">
                <div>
                    <h2 id="modalTitle" class="text-xl font-bold"></h2>
                    <p class="text-[10px] text-[#39B54A] font-bold uppercase tracking-widest">Training One Showcase</p>
                </div>
                <button onclick="closeModal()" class="bg-gray-100 p-2 rounded-full hover:bg-red-500 hover:text-white transition-all">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="p-6 md:p-10">
                <div class="mb-10">
                    <p id="modalDesc" class="text-gray-600 leading-relaxed"></p>
                </div>
                <div id="modalImageGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
            </div>

            <div class="p-8 text-center bg-gray-50">
                <p class="text-gray-400 text-xs">END OF ALBUM</p>
            </div>
        </div>
    </div>

    <script>
        const albums = {
            'elaas': {
                title: "New e-LAAS อบจ.สระแก้ว",
                desc: "โครงการอบรมระบบบัญชีคอมพิวเตอร์ลูกองค์กรปกครองส่วนท้องถิ่น (New e-LAAS) ณ องค์การบริหารส่วนจังหวัดสระแก้ว",
                prefix: "LINE_ALBUM_New e-LAAS อบจ.สระแก้ว 73(73)_260322_",
                count: 7
            }
        };

        function openAlbum(key) {
            const album = albums[key];
            const modal = document.getElementById('albumModal');
            const grid = document.getElementById('modalImageGrid');

            document.getElementById('modalTitle').innerText = album.title;
            document.getElementById('modalDesc').innerText = album.desc;

            grid.innerHTML = '';
            for (let i = 1; i <= album.count; i++) {
                grid.innerHTML += `
                    <div class="rounded-2xl overflow-hidden shadow-lg bg-gray-100 group">
                        <img src="${album.prefix}${i}.jpg" 
                             class="w-full h-auto object-cover cursor-zoom-in hover:opacity-90 transition" 
                             onclick="window.open(this.src)"
                             onerror="this.parentElement.style.display='none'">
                    </div>
                `;
            }

            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('modal-open');
                document.body.style.overflow = 'hidden';
            }, 50);
        }

        function closeModal() {
            const modal = document.getElementById('albumModal');
            modal.classList.remove('modal-open');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 400);
        }

        let isMenuOpen = false;

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            isMenuOpen = !isMenuOpen;

            if (isMenuOpen) {
                menu.classList.add('active');
                btn.classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                menu.classList.remove('active');
                btn.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        // Scroll Progress
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scroll-progress').style.width = scrolled + '%';
        });
    </script>
</body>

</html>
